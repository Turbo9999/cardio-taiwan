    <h1>隱私權政策</h1>
    <p>最後更新：2026 年 9 月 19 日</p>
    <h2>我們收集的資料</h2>
    <p>當你使用 Google 登入時，Cardio Taiwan 會取得 Google 提供的基本帳號識別資訊，例如 Email 與顯示名稱。我們也會儲存你在本站累積的 XP、連續運動天數、完成紀錄與勳章。</p>
    <h2>資料如何使用</h2>
    <p>資料只用於建立你的個人運動進度與跨裝置同步，不會出售或出租給第三方。</p>
    <h2>資料保存與刪除</h2>
    <p>資料保存在 Supabase 的受保護資料庫，僅該帳號可讀取與更新。如需刪除帳號資料，請聯絡網站管理者。</p>
